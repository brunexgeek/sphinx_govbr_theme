# docker-compose.yml

services:
  nginx:
    image: nginx:alpine
    ports:
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/sphinx_govbr_theme_build:/usr/share/nginx/html
    depends_on:
      - comentario

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: comentario
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      timeout: 5s
      retries: 5
      start_period: 10s

  comentario:
    image: registry.gitlab.com/comentario/comentario
    hostname: comentario
    environment:
      BASE_URL: http://localhost:9000/_comentario/
      SECRETS_FILE: "/secrets.yml"
      NO_LIVE_UPDATE: true
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost/api/user"]
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets.yml:/secrets.yml:ro